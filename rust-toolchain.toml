[toolchain]
# matrix-sdk 0.19 requires rustc 1.96+. (The old 1.92 pin worked around a
# query-depth overflow in matrix-sdk 0.16 on 1.95+; 0.19 builds cleanly.)
# Keep `cargo fmt`'s rustfmt aligned by always running through this
# toolchain -- the formatting style differs subtly between rustfmt versions.
channel = "1.100.0"
components = ["rustfmt", "clippy"]
