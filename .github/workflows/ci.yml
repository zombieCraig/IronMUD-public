name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        # Pin to 1.91 — matrix-sdk 0.16 hits a query-depth regression on
        # stable 1.92+ in CI environments. Revisit when matrix-sdk is
        # upgraded.
        uses: dtolnay/rust-toolchain@1.91
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (advisory)
        # Existing codebase has ~750 pre-fmt-sweep clippy findings. Run as
        # advisory for now; promote to `-- -D warnings` after a cleanup pass.
        run: cargo clippy --all-targets --all-features
        continue-on-error: true

      - name: cargo test
        run: cargo test --all --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit
        # Warnings (unmaintained transitive deps like fxhash, instant, rand)
        # are informational; fail only on actual vulnerabilities.
        #
        # The ignored IDs are the rustls 0.22 / rustls-webpki 0.102 advisories
        # that arrive only via serenity 0.12.5 (Discord bridge), which has no
        # release on rustls 0.23 yet. See the triage note at the top of
        # Cargo.toml. They are ignored by ID here (not in an audit.toml) so
        # local/pre-commit audits still show them, and any *new* advisory
        # still fails CI. Drop these when serenity moves to rustls 0.23.
        run: >-
          cargo audit
          --ignore RUSTSEC-2026-0049
          --ignore RUSTSEC-2026-0098
          --ignore RUSTSEC-2026-0099
          --ignore RUSTSEC-2026-0104
          --ignore RUSTSEC-2026-0346
          --ignore RUSTSEC-2026-0349
          --ignore RUSTSEC-2026-0382
