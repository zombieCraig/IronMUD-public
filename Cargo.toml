[package]
name = "ironmud"
version = "0.1.0"
edition = "2024"

# cargo audit triage
#
# The pre-commit hook runs `cargo audit` as advisory and asks for findings to be
# sorted into known-and-unused / waiting-on-upstream / new-and-actionable. These
# sit in the middle bucket:
#
# Unmaintained-crate notices with no patched version published -- there is
# nothing to upgrade *to* -- arriving through dependencies this project is
# built on rather than through anything it calls:
#
#   fxhash            RUSTSEC-2025-0057   sled -> fxhash
#   instant           RUSTSEC-2024-0384   rhai, and sled -> parking_lot 0.11
#   smartstring       RUSTSEC-2026-0249   rhai -> smartstring
#   anymap2           RUSTSEC-2026-0319   matrix-sdk -> anymap2
#   unsafe-libyaml    RUSTSEC-2024-0449   serde_yaml -> unsafe-libyaml
#
# Vulnerabilities in rustls 0.22 / rustls-webpki 0.102 (RUSTSEC-2026-0049,
# -0098, -0099, -0104, -0346, -0349, -0382). These come only from serenity
# 0.12.5 (Discord bridge, via tokio-tungstenite 0.21), which has no newer
# release. Builds that don't need Discord avoid them entirely with
# `--no-default-features --features matrix`. Revisit when serenity ships a
# release on rustls 0.23.
#
# matrix-sdk moved 0.16 -> 0.19 (Nov 2026) to clear vodozemac, imbl-sized-chunks
# and bitmaps advisories. 0.19 dropped `native-tls`, so it uses rustls with the
# aws-lc-rs backend: building it needs cmake and a C compiler.
#
# They are deliberately NOT added to an `audit.toml` ignore list. A real
# advisory against one of these crates would then arrive silently, and the whole
# value of the hook is that a new line in its output means something.

[dependencies]
tokio = { version = "1.36", features = ["full"] }
rhai = { version = "1.17", features = ["sync"] }
anyhow = "1.0"
# Non-poisoning mutexes: a panic while holding World/Connections must not
# turn every later lock into a panic. `deadlock-detection` feature below.
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sled = "0.34"
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
notify = "6.1"
glob = "0.3"
# Chat bridges are optional (`matrix`, `discord` features, both on by
# default). `--no-default-features` builds a server without either SDK.
matrix-sdk = { version = "0.19", default-features = false, features = ["rustls-aws-lc-rs"], optional = true }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend"], optional = true }
socket2 = "0.5"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
sha2 = "0.10"
subtle = "2.6"
clap = { version = "4.4", features = ["derive", "env"] }
rpassword = "7.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
unicode-width = "0.2"
mime = "0.3"
axum = "0.7"
tower = { version = "0.4", features = ["limit", "util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
time = ">=0.3.47"

[features]
default = ["matrix", "discord"]
matrix = ["dep:matrix-sdk"]
discord = ["dep:serenity"]
# Debug aid: a background thread reports lock cycles (World/Connections
# deadlocks) with the stuck threads' backtraces. Adds overhead; not for
# production. `cargo run --features deadlock-detection`.
deadlock-detection = ["parking_lot/deadlock_detection"]

[dev-dependencies]
regex = "1.10"
tempfile = "3.10"
tokio = { version = "1.36", features = ["full", "test-util"] }
# `metadata` exposes Engine::gen_fn_signatures for tests/engine_registration.rs.
rhai = { version = "1.17", features = ["sync", "metadata"] }

[[bin]]
name = "ironmud-admin"
path = "src/bin/ironmud-admin.rs"

[[bin]]
name = "ironmud-import"
path = "src/bin/ironmud-import.rs"
[profile.release]
# Integer overflow panics in release too, instead of silently wrapping (a
# wrapped gold/HP/count is a silent exploit). Commands run under
# catch_unwind and ticks under ticks::supervise, so a panic aborts one
# command or restarts one tick rather than taking the server down.
overflow-checks = true
