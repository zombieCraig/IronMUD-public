[package]
name = "ironmud"
version = "0.1.0"
edition = "2024"

# cargo audit triage
#
# The pre-commit hook runs `cargo audit` as advisory and asks for findings to be
# sorted into known-and-unused / waiting-on-upstream / new-and-actionable. Three
# sit permanently in the middle bucket. All are **unmaintained-crate** notices
# with no patched version published — there is nothing to upgrade *to* — and all
# arrive through dependencies this project is built on rather than through
# anything it calls:
#
#   fxhash            RUSTSEC-2025-0057   sled -> fxhash
#   instant           RUSTSEC-2024-0384   rhai, and sled -> parking_lot 0.11
#   proc-macro-error2 RUSTSEC-2026-0173   matrix-sdk -> matrix-pickle-derive,
#                                                       aquamarine
#
# Clearing them means replacing sled or rhai, which is the storage layer and the
# scripting engine. `proc-macro-error2` alone would clear on matrix-sdk 0.18,
# but 0.18 drops the `native-tls` feature used below, so it is a TLS migration
# bought to silence a *build-time* proc macro with no known vulnerability. Not a
# good trade; revisit when matrix-sdk is being upgraded for its own reasons.
#
# They are deliberately NOT added to an `audit.toml` ignore list. A real
# advisory against one of these crates would then arrive silently, and the whole
# value of the hook is that a new line in its output means something.

[dependencies]
tokio = { version = "1.36", features = ["full"] }
rhai = { version = "1.17", features = ["sync"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sled = "0.34"
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
notify = "6.1"
glob = "0.3"
matrix-sdk = { version = "0.16", default-features = false, features = ["native-tls"] }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "native_tls_backend"] }
socket2 = "0.5"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }
rand = "0.8"
clap = { version = "4.4", features = ["derive", "env"] }
rpassword = "7.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder"] }
unicode-width = "0.2"
mime = "0.3"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
time = ">=0.3.47"

[dev-dependencies]
regex = "1.10"
tempfile = "3.10"

[[bin]]
name = "ironmud-admin"
path = "src/bin/ironmud-admin.rs"

[[bin]]
name = "ironmud-import"
path = "src/bin/ironmud-import.rs"